# ============================================================
#  Secret Scan — gitleaks
#
#  Scans every push and PR for committed credentials (API
#  keys, private keys, base64-encoded secrets in k8s Secret
#  manifests, etc.) before they land on main/develop.
#
#  NOTE: if this repo is private, gitleaks-action needs a
#  license — set secrets.GITLEAKS_LICENSE (free for individual
#  use at gitleaks.io). Public repos need nothing extra.
#
#  This won't retroactively clean history — the machine-identity
#  credentials already committed under bootstrapping/ predate
#  this scan and were already applied to the live cluster.
#  Rotating them in Infisical is a separate, manual follow-up.
# ============================================================

name: Secret Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
