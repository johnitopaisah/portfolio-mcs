# ============================================================
#  Deployment — ShopNow Postgres Exporter
#
#  Second instance of prometheuscommunity/postgres-exporter,
#  pointed at ecommerce's postgres instead of portfolio's. DSN is
#  built from DB_USER/DB_PASSWORD/DB_NAME (the same three keys
#  api-secret already has, synced separately into this namespace
#  by 07-shopnow-postgres-exporter-secret.yaml) rather than
#  requiring a dedicated MONITORING_DB_DSN key to exist in the
#  shopnow-l-jyo Infisical project — one less manual step.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopnow-postgres-exporter
  namespace: monitoring
  labels:
    app: shopnow-postgres-exporter
    app.kubernetes.io/name: shopnow-postgres-exporter
    app.kubernetes.io/part-of: portfolio-monitoring
    app.kubernetes.io/component: exporter
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopnow-postgres-exporter
  template:
    metadata:
      labels:
        app: shopnow-postgres-exporter
        app.kubernetes.io/name: shopnow-postgres-exporter
        app.kubernetes.io/part-of: portfolio-monitoring
        app.kubernetes.io/component: exporter
    spec:
      serviceAccountName: shopnow-postgres-exporter
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shopnow-postgres-exporter-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopnow-postgres-exporter-secret
                  key: DB_PASSWORD
            # - name: DB_NAME
            #   valueFrom:
            #     secretKeyRef:
            #       name: shopnow-postgres-exporter-secret
            #       key: DB_NAME
            # Kubernetes substitutes $(VAR) from the env vars defined above —
            # no wrapper script needed to assemble the DSN.
            - name: DATA_SOURCE_NAME
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres.ecommerce.svc.cluster.local:5432/$(DB_NAME)?sslmode=disable"
          args:
            - --collector.stat_bgwriter
            - --collector.stat_database
            - --collector.stat_user_tables
            - --collector.process_idle
          ports:
            - name: metrics
              containerPort: 9187
              protocol: TCP
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 9187
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 9187
            initialDelaySeconds: 10
            periodSeconds: 5
