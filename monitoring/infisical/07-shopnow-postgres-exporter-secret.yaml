# ============================================================
#  InfisicalSecret — syncs ShopNow's DB_USER/DB_PASSWORD/DB_NAME
#  (the same keys api-secret already has, from the shopnow-l-jyo
#  project) into a Secret local to the "monitoring" namespace.
#
#  credentialsRef points at the machine-identity secret that
#  already exists in "ecommerce" — reused here, same pattern as
#  backup/06-shopnow-infisical-secret.yaml.
# ============================================================
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: shopnow-postgres-exporter-infisical-secret
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: portfolio-monitoring
    app.kubernetes.io/managed-by: argocd
spec:
  hostAPI: https://app.infisical.com/api

  resyncInterval: 60

  authentication:
    universalAuth:
      secretsScope:
        projectSlug:  "shopnow-l-jyo"
        envSlug:      "dev"
        secretsPath:  "/"
      credentialsRef:
        secretName:      infisical-machine-identity
        secretNamespace: ecommerce

  managedSecretReference:
    secretName:      shopnow-postgres-exporter-secret
    secretNamespace: monitoring
    creationPolicy:  Orphan
