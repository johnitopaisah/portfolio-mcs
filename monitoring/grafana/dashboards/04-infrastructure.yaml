apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-04-infrastructure
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: portfolio-monitoring
    app.kubernetes.io/component: visualization
    app.kubernetes.io/managed-by: argocd
    dashboard: infrastructure
data:
  04-infrastructure.json: |
    {
      "uid": "portfolio-infra",
      "title": "Kubernetes Infrastructure",
      "description": "Node resources, pod health, container restarts, PVC usage across all 3 nodes",
      "tags": ["portfolio-mcs", "kubernetes", "infrastructure"],
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Running Pods (portfolio ns)",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "options": { "colorMode": "background" },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "yellow", "value": 3 }, { "color": "green", "value": 5 }] } } },
          "targets": [{ "expr": "count(kube_pod_status_phase{namespace=\"portfolio\",phase=\"Running\"} == 1) or vector(0)", "legendFormat": "Running" }]
        },
        {
          "id": 2, "type": "stat", "title": "Pending Pods",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "options": { "colorMode": "background" },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 1 }] } } },
          "targets": [{ "expr": "count(kube_pod_status_phase{namespace=\"portfolio\",phase=\"Pending\"} == 1) or vector(0)", "legendFormat": "Pending" }]
        },
        {
          "id": 3, "type": "stat", "title": "Failed Pods",
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "options": { "colorMode": "background" },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 1 }] } } },
          "targets": [{ "expr": "count(kube_pod_status_phase{namespace=\"portfolio\",phase=\"Failed\"} == 1) or vector(0)", "legendFormat": "Failed" }]
        },
        {
          "id": 4, "type": "stat", "title": "Cluster Nodes Ready",
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
          "options": { "colorMode": "background" },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "yellow", "value": 2 }, { "color": "green", "value": 3 }] } } },
          "targets": [{ "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "legendFormat": "Nodes ready" }]
        },
        {
          "id": 5, "type": "stat", "title": "Total Container Restarts (24h)",
          "gridPos": { "x": 16, "y": 0, "w": 4, "h": 4 },
          "options": { "colorMode": "background" },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 }] } } },
          "targets": [{ "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"portfolio\"}[24h]))", "legendFormat": "Restarts" }]
        },
        {
          "id": 6, "type": "stat", "title": "HPA Desired Replicas",
          "gridPos": { "x": 20, "y": 0, "w": 4, "h": 4 },
          "options": { "colorMode": "value" },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{ "color": "blue", "value": 0 }] } } },
          "targets": [{ "expr": "sum(kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"portfolio\"})", "legendFormat": "Replicas" }]
        },
        {
          "id": 7, "type": "timeseries", "title": "Node CPU Usage per Node",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "color": { "mode": "palette-classic" } } },
          "targets": [{ "expr": "1 - rate(node_cpu_seconds_total{mode=\"idle\"}[5m])", "legendFormat": "{{instance}}" }]
        },
        {
          "id": 8, "type": "timeseries", "title": "Node Memory Usage per Node",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "color": { "mode": "palette-classic" } } },
          "targets": [{ "expr": "1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)", "legendFormat": "{{instance}}" }]
        },
        {
          "id": 9, "type": "timeseries", "title": "CPU: Requested vs Actual (portfolio pods)",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "cores", "color": { "mode": "palette-classic" } } },
          "targets": [
            { "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"portfolio\",container!=\"\"}[5m]))", "legendFormat": "{{pod}} actual" },
            { "expr": "sum by (pod) (kube_pod_container_resource_requests{namespace=\"portfolio\",resource=\"cpu\"})", "legendFormat": "{{pod}} requested" }
          ]
        },
        {
          "id": 10, "type": "timeseries", "title": "Memory: Requested vs Actual (portfolio pods)",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" } } },
          "targets": [
            { "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"portfolio\",container!=\"\"})", "legendFormat": "{{pod}} actual" },
            { "expr": "sum by (pod) (kube_pod_container_resource_requests{namespace=\"portfolio\",resource=\"memory\"})", "legendFormat": "{{pod}} requested" }
          ]
        },
        {
          "id": 11, "type": "table", "title": "Container Restarts by Pod",
          "gridPos": { "x": 0, "y": 20, "w": 12, "h": 8 },
          "options": { "sortBy": [{ "displayName": "Restarts", "desc": true }] },
          "targets": [{
            "expr": "sum by (pod, container) (kube_pod_container_status_restarts_total{namespace=\"portfolio\"})",
            "legendFormat": "{{pod}} / {{container}}",
            "instant": true,
            "format": "table"
          }]
        },
        {
          "id": 12, "type": "timeseries", "title": "Node Disk I/O",
          "gridPos": { "x": 12, "y": 20, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "Bps", "color": { "mode": "palette-classic" } } },
          "targets": [
            { "expr": "sum by (instance) (rate(node_disk_read_bytes_total[5m]))", "legendFormat": "{{instance}} read" },
            { "expr": "sum by (instance) (rate(node_disk_written_bytes_total[5m]))", "legendFormat": "{{instance}} write" }
          ]
        },
        {
          "id": 13, "type": "timeseries", "title": "Network I/O (all nodes)",
          "gridPos": { "x": 0, "y": 28, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "Bps", "color": { "mode": "palette-classic" } } },
          "targets": [
            { "expr": "sum(rate(node_network_receive_bytes_total{device!~\"lo|veth.*\"}[5m]))", "legendFormat": "Received" },
            { "expr": "sum(rate(node_network_transmit_bytes_total{device!~\"lo|veth.*\"}[5m]))", "legendFormat": "Transmitted" }
          ]
        },
        {
          "id": 14, "type": "gauge", "title": "PVC Remaining — portfolio-db",
          "description": "Declared allocation (10Gi) minus real DB size (sum of pg_database_size_bytes from postgres-exporter). Not kubelet_volume_stats — minikube's hostPath StorageClass doesn't implement CSI NodeGetVolumeStats, so that metric never populates here. The declared allocation isn't kernel-enforced either (hostPath), but this is the real number to track against it.",
          "gridPos": { "x": 12, "y": 28, "w": 6, "h": 4 },
          "fieldConfig": { "defaults": { "unit": "bytes", "min": 0, "max": 10737418240, "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "yellow", "value": 1073741824 }, { "color": "green", "value": 3221225472 }] } } },
          "targets": [{ "expr": "sum(kube_persistentvolumeclaim_resource_requests_storage_bytes{persistentvolumeclaim=\"portfolio-db-pvc\"}) - sum(pg_database_size_bytes{job=\"postgres-exporter\"})", "legendFormat": "DB PVC remaining" }]
        },
        {
          "id": 15, "type": "gauge", "title": "PVC Remaining — prometheus",
          "description": "Declared allocation (15Gi) minus Prometheus's own reported TSDB size (prometheus_tsdb_storage_blocks_bytes). Same rationale as the portfolio-db panel — kubelet_volume_stats doesn't work on this StorageClass.",
          "gridPos": { "x": 18, "y": 28, "w": 6, "h": 4 },
          "fieldConfig": { "defaults": { "unit": "bytes", "min": 0, "max": 16106127360, "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "yellow", "value": 1610612736 }, { "color": "green", "value": 4831838208 }] } } },
          "targets": [{ "expr": "sum(kube_persistentvolumeclaim_resource_requests_storage_bytes{persistentvolumeclaim=\"prometheus-pvc\"}) - sum(prometheus_tsdb_storage_blocks_bytes)", "legendFormat": "Prometheus PVC remaining" }]
        },
        {
          "id": 20, "type": "gauge", "title": "PVC Remaining — grafana",
          "description": "Declared allocation (15Gi) minus grafana-pvc's real usage (du -sb /var/lib/grafana, pushed every 5min by backup/pvc-metrics-pusher CronJob since Grafana doesn't expose its own disk footprint as a metric). Same hostPath/kubelet_volume_stats rationale as the other PVC panels.",
          "gridPos": { "x": 12, "y": 32, "w": 6, "h": 4 },
          "fieldConfig": { "defaults": { "unit": "bytes", "min": 0, "max": 16106127360, "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "yellow", "value": 1610612736 }, { "color": "green", "value": 4831838208 }] } } },
          "targets": [{ "expr": "sum(kube_persistentvolumeclaim_resource_requests_storage_bytes{persistentvolumeclaim=\"grafana-pvc\"}) - sum(grafana_data_bytes)", "legendFormat": "Grafana PVC remaining" }]
        },
        {
          "id": 21, "type": "gauge", "title": "PVC Remaining — pushgateway",
          "description": "Declared allocation (3Gi) minus pushgateway-pvc's real usage (du -sb /data, pushed every 5min by backup/pvc-metrics-pusher CronJob — Pushgateway holds latest-value snapshots, not a self-reported disk-size metric). Same hostPath/kubelet_volume_stats rationale as the other PVC panels.",
          "gridPos": { "x": 18, "y": 32, "w": 6, "h": 4 },
          "fieldConfig": { "defaults": { "unit": "bytes", "min": 0, "max": 3221225472, "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "yellow", "value": 322122547 }, { "color": "green", "value": 966367642 }] } } },
          "targets": [{ "expr": "sum(kube_persistentvolumeclaim_resource_requests_storage_bytes{persistentvolumeclaim=\"pushgateway-pvc\"}) - sum(pushgateway_data_bytes)", "legendFormat": "Pushgateway PVC remaining" }]
        },
        {
          "id": 16, "type": "row", "title": "HPA Activity (api / user-ui / admin-ui)",
          "description": "Autoscaling behavior for the 3 HPA-managed Deployments. Min/max bounds: api 2-10, user-ui 2-5, admin-ui 1-3 (see k8s/*/hpa-*.yaml) — static, so not plotted as series here.",
          "gridPos": { "x": 0, "y": 36, "w": 24, "h": 1 }
        },
        {
          "id": 17, "type": "timeseries", "title": "HPA Current vs Desired Replicas",
          "gridPos": { "x": 0, "y": 37, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "palette-classic" } } },
          "targets": [
            { "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"portfolio\"}", "legendFormat": "{{horizontalpodautoscaler}} current" },
            { "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"portfolio\"}", "legendFormat": "{{horizontalpodautoscaler}} desired" }
          ]
        },
        {
          "id": 18, "type": "timeseries", "title": "HPA CPU / Memory Utilization vs Target",
          "description": "Solid = actual utilization (kube_horizontalpodautoscaler_status_target_metric), dashed-equivalent = configured target (kube_horizontalpodautoscaler_spec_target_metric) — when actual crosses target, that's what triggers a scale-up.",
          "gridPos": { "x": 12, "y": 37, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "percent", "color": { "mode": "palette-classic" } } },
          "targets": [
            { "expr": "kube_horizontalpodautoscaler_status_target_metric{namespace=\"portfolio\", metric_target_type=\"utilization\"}", "legendFormat": "{{horizontalpodautoscaler}} {{metric_name}} actual" },
            { "expr": "kube_horizontalpodautoscaler_spec_target_metric{namespace=\"portfolio\", metric_target_type=\"utilization\"}", "legendFormat": "{{horizontalpodautoscaler}} {{metric_name}} target" }
          ]
        },
        {
          "id": 19, "type": "timeseries", "title": "HPA Scaling Conditions",
          "description": "AbleToScale=false or ScalingActive=false means the HPA can't act right now (e.g. missing metrics). ScalingLimited=true means it's capped by min/max replicas, not by choice — worth checking maxReplicas if this stays on.",
          "gridPos": { "x": 0, "y": 45, "w": 24, "h": 6 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "max": 1, "custom": { "lineInterpolation": "stepAfter", "fillOpacity": 10 }, "color": { "mode": "palette-classic" } } },
          "targets": [{
            "expr": "kube_horizontalpodautoscaler_status_condition{namespace=\"portfolio\", status=\"true\"}",
            "legendFormat": "{{horizontalpodautoscaler}} {{condition}}"
          }]
        }
      ],
      "schemaVersion": 38,
      "version": 1
    }
