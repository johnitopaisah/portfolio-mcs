# Shared platform pieces the API depends on: Redis (cache + rate limits)
# and the pre-migration backup volume used by the API's PreSync Job.
# Wave 0 — alongside the DB, before the API (wave 1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-platform
  namespace: argocd
  labels:
    app.kubernetes.io/name: portfolio-platform
    app.kubernetes.io/part-of: portfolio-mcs
    app.kubernetes.io/component: platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: portfolio-mcs
  source:
    repoURL: https://github.com/johnitopaisah/portfolio-mcs
    targetRevision: develop
    path: k8s/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  syncPolicy:
    automated:
      selfHeal: true
      prune: true      # the backup PVC opts out (Prune=false,Delete=false)
    syncOptions:
      - CreateNamespace=false
