# ============================================================
#  InfisicalSecret — syncs ShopNow's DB credentials (the same
#  ones api-secret already has, from the shopnow-l-jyo project)
#  into a Secret local to the "backup" namespace.
#
#  Same reasoning as 02-infisical-secret.yaml: this CronJob runs
#  in "backup", not "ecommerce" where api-secret lives, and a
#  Secret can't be referenced across namespaces. credentialsRef
#  points at the machine-identity secret that already exists in
#  "ecommerce" (applied once, by hand, when ShopNow's Infisical
#  project was first set up) — reused here, not duplicated.
# ============================================================
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: backup-shopnow-infisical-secret
  namespace: backup
  labels:
    app: shopnow
    component: backup

spec:
  hostAPI: https://app.infisical.com/api

  resyncInterval: 60

  authentication:
    universalAuth:
      secretsScope:
        projectSlug:  "shopnow-l-jyo"
        envSlug:      "dev"
        secretsPath:  "/"
      credentialsRef:
        secretName:      infisical-machine-identity
        secretNamespace: ecommerce

  managedSecretReference:
    secretName:      backup-shopnow-db-secrets
    secretNamespace: backup
    creationPolicy:  Orphan
