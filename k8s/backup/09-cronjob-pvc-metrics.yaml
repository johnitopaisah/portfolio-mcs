# ============================================================
#  CronJob — Grafana / Pushgateway PVC Usage Metrics
#
#  Neither Grafana nor Pushgateway exposes its own on-disk size as a
#  metric (unlike Prometheus's prometheus_tsdb_storage_blocks_bytes or
#  postgres-exporter's pg_database_size_bytes), and minikube's hostPath
#  StorageClass doesn't implement CSI NodeGetVolumeStats either, so
#  kubelet_volume_stats_* never populates. This computes real du -sb
#  usage via kubectl exec into the already-running pods — same
#  exec-based approach as backup-monitoring.sh, reusing its RBAC
#  (backup-monitoring-exec) rather than mounting either PVC a second
#  time — and pushes it to Pushgateway for the "PVC Remaining"
#  dashboard gauges to read.
#
#  Runs every 5 minutes — much more frequent than the daily backup job,
#  since this feeds a live dashboard rather than a backup archive.
# ============================================================

apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-metrics-pusher
  namespace: backup
  labels:
    app: portfolio-mcs
    component: backup
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  suspend: false
  concurrencyPolicy: Forbid

  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: portfolio-mcs
            component: backup
          annotations:
            description: "Pushes real grafana-pvc / pushgateway-pvc disk usage to Pushgateway"
        spec:
          serviceAccountName: backup-serviceaccount
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 30

          containers:
            - name: pusher
              image: google/cloud-sdk:slim
              imagePullPolicy: IfNotPresent

              command: ["/bin/bash"]
              args:
                - -c
                - |
                  set -e
                  apt-get update -qq && apt-get install -y -qq kubectl wget

                  push_usage() {
                    local metric_name="$1" pod_label="$2" data_path="$3"
                    local pod
                    pod=$(kubectl get pod -n monitoring -l "$pod_label" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                    if [ -z "$pod" ]; then
                      echo "[$(date)] ⚠ no pod matching $pod_label, skipping $metric_name"
                      return
                    fi
                    local bytes
                    bytes=$(kubectl exec -n monitoring "$pod" -- du -sb "$data_path" 2>/dev/null | cut -f1)
                    if [ -z "$bytes" ]; then
                      echo "[$(date)] ⚠ du failed on $pod:$data_path, skipping $metric_name"
                      return
                    fi
                    local metric_file
                    metric_file=$(mktemp)
                    echo "${metric_name} ${bytes}" > "$metric_file"
                    wget -q -O /dev/null --header="Content-Type: text/plain" \
                      --post-file="$metric_file" \
                      "http://pushgateway.monitoring.svc.cluster.local:9091/metrics/job/pvc_metrics/instance/${metric_name}" \
                      && echo "[$(date)] ✓ ${metric_name}=${bytes}"
                    rm -f "$metric_file"
                  }

                  push_usage grafana_data_bytes     "app.kubernetes.io/name=grafana"     /var/lib/grafana
                  push_usage pushgateway_data_bytes  "app.kubernetes.io/name=pushgateway" /data

              resources:
                requests:
                  cpu: "100m"
                  memory: "200Mi"
                limits:
                  cpu: "400m"
                  memory: "512Mi"

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                # Not dropping capabilities: apt-get internally de-escalates
                # to a sandboxed "_apt" user via setuid/setgid/setgroups —
                # see 04-cronjob-db-backup.yaml for the full rationale.
