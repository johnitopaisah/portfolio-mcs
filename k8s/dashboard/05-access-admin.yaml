# ============================================================
#  Login identity — the token you paste into the dashboard's
#  sign-in screen. Bound to the BUILT-IN "view" ClusterRole:
#  read-only, cluster-wide, zero mutate/delete verbs.
#
#  Do not bind this to "edit" or "cluster-admin". If write access
#  from the UI is ever needed, prefer a new ClusterRole scoped to
#  the specific verbs/resources required, over widening this one.
#
#  Get a login token (expires after 1h by default):
#    kubectl --kubeconfig=.kube/devops-minikube.yaml \
#      -n kubernetes-dashboard create token dashboard-admin
# ============================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-admin
  namespace: kubernetes-dashboard
  labels:
    app.kubernetes.io/part-of: platform-tools
    app.kubernetes.io/managed-by: argocd
automountServiceAccountToken: false

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-admin-view
  labels:
    app.kubernetes.io/part-of: platform-tools
    app.kubernetes.io/managed-by: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: dashboard-admin
    namespace: kubernetes-dashboard
