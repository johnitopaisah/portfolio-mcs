# ============================================================
#  Network Policies — kubernetes-dashboard namespace
#
#  Design: default-deny-all + explicit allow rules, matching
#  k8s/policies/04-network-policy.yaml for the portfolio namespace.
#
#  Ingress from traefik is allowed for the public Ingress route
#  (kube-dashboard.johnisah.com) — actual authentication for that
#  path happens at Cloudflare Access, in front of Traefik, not here.
#  `kubectl port-forward` tunneled over SSH remains available too;
#  it reaches the pod via the API server/kubelet rather than the
#  normal Service/CNI ingress path these rules govern.
#
#  CORRECTION: kindnet DOES enforce NetworkPolicy in this cluster —
#  confirmed the hard way on 2026-09-02, when default-deny-all silently
#  black-holed cert-manager's HTTP-01 solver pod (no matching allow rule
#  for its dynamically-created labels) and hung every request to it with
#  a full connection timeout rather than a fast rejection. The identical
#  "does not enforce" note in k8s/policies/04-network-policy.yaml is
#  equally stale and should not be trusted either.
# ============================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: kubernetes-dashboard
  labels:
    app.kubernetes.io/part-of: platform-tools
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---

# Ingress: dashboard <-> metrics-scraper, within this namespace only.
# Egress:  CoreDNS, kube-apiserver (kubernetes.default.svc lives in
#          the "default" namespace), and metrics-scraper.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dashboard
  namespace: kubernetes-dashboard
  labels:
    app.kubernetes.io/part-of: platform-tools
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app: kubernetes-dashboard
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubernetes-dashboard

    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 9090

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 443

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubernetes-dashboard

---

# cert-manager creates one of these pods per HTTP-01 challenge attempt
# (torn down again once solved), always carrying this label. Traefik and
# cert-manager's own self-check both need to reach it on its fixed
# acmesolver port; scoped this narrowly rather than to a specific
# namespace/pod source since both callers' identities are outside our
# control and the pod only exists for the few seconds/minutes a
# challenge is in flight.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-acme-http01-solver
  namespace: kubernetes-dashboard
  labels:
    app.kubernetes.io/part-of: platform-tools
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8089
