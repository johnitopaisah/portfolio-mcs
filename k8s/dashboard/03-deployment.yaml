apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-dashboard
  namespace: kubernetes-dashboard
  labels:
    app: kubernetes-dashboard
    component: web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kubernetes-dashboard
      component: web
  template:
    metadata:
      labels:
        app: kubernetes-dashboard
        component: web
    spec:
      serviceAccountName: kubernetes-dashboard
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: kubernetes-dashboard
          image: docker.io/kubernetesui/dashboard:v2.7.0
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 9090
              protocol: TCP

          # Plain HTTP internally, same as argocd-deploy-server in this cluster
          # (see bootstrapping/argocd-ingress-traefik.yaml) — TLS is terminated
          # at Cloudflare/Traefik, not re-terminated again inside the pod. Avoids
          # the self-signed-backend-cert dance a Traefik->HTTPS backend needs.
          args:
            - --insecure-bind-address=0.0.0.0
            - --insecure-port=9090
            - --namespace=kubernetes-dashboard

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 2001

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

          resources:
            requests:
              cpu: "20m"
              memory: "96Mi"
            limits:
              cpu: "150m"
              memory: "224Mi"

          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /
              port: 9090
            initialDelaySeconds: 30
            timeoutSeconds: 30
            periodSeconds: 15
            failureThreshold: 3

      volumes:
        - name: tmp-volume
          emptyDir: {}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-metrics-scraper
  namespace: kubernetes-dashboard
  labels:
    app: kubernetes-dashboard
    component: metrics-scraper
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kubernetes-dashboard
      component: metrics-scraper
  template:
    metadata:
      labels:
        app: kubernetes-dashboard
        component: metrics-scraper
    spec:
      serviceAccountName: kubernetes-dashboard
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: dashboard-metrics-scraper
          image: docker.io/kubernetesui/metrics-scraper:v1.0.9
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 2001

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

          resources:
            requests:
              cpu: "15m"
              memory: "48Mi"
            limits:
              cpu: "80m"
              memory: "96Mi"

          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /
              port: 8000
            initialDelaySeconds: 30
            timeoutSeconds: 30
            periodSeconds: 15
            failureThreshold: 3

      volumes:
        - name: tmp-volume
          emptyDir: {}
