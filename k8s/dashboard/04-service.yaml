# ClusterIP only — no NodePort/LoadBalancer. Reachable two ways:
#   1. Public: kube-dashboard.johnisah.com, gated by Cloudflare Access
#      (see 07-ingress.yaml + terraform/modules/cloudflare_access) before
#      the request ever reaches Traefik.
#   2. Fallback: kubectl --kubeconfig=.kube/devops-minikube.yaml
#      -n kubernetes-dashboard port-forward svc/kubernetes-dashboard 8080:80
#      tunneled over SSH.
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-dashboard
  namespace: kubernetes-dashboard
  labels:
    app: kubernetes-dashboard
    component: web
spec:
  type: ClusterIP
  selector:
    app: kubernetes-dashboard
    component: web
  ports:
    - name: http
      port: 80
      targetPort: 9090
      protocol: TCP

---

apiVersion: v1
kind: Service
metadata:
  name: dashboard-metrics-scraper
  namespace: kubernetes-dashboard
  labels:
    app: kubernetes-dashboard
    component: metrics-scraper
spec:
  type: ClusterIP
  selector:
    app: kubernetes-dashboard
    component: metrics-scraper
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
