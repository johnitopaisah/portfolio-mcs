# ============================================================
#  SearXNG — self-hosted, free discovery search backend.
#  Internal only (ClusterIP, no ingress) — used solely by the
#  scraper CronJob. settings.yml (with its secret_key already
#  baked in) comes from the existing Infisical-synced
#  portfolio-secrets Secret, key SEARXNG_SETTINGS_YML — nothing
#  sensitive is committed to git.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: portfolio
  labels:
    app: portfolio-mcs
    component: searxng
spec:
  replicas: 1
  strategy:
    type: Recreate   # single replica, avoid two pods racing on startup
  selector:
    matchLabels:
      app: portfolio-mcs
      component: searxng
  template:
    metadata:
      labels:
        app: portfolio-mcs
        component: searxng
    spec:

      enableServiceLinks: false

      securityContext:
        fsGroup: 977   # searxng group id in the upstream image

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: cache
          emptyDir:
            sizeLimit: 128Mi
        - name: searxng-settings
          secret:
            secretName: portfolio-secrets
            items:
              - key:  SEARXNG_SETTINGS_YML
                path: settings.yml

      containers:
        # Read-only root filesystem, audited against this exact image digest
        # (Nov 2026): searxng only needs /tmp and /var/cache/searxng writable.
        # Pinned by digest — :latest could pull a build that writes elsewhere.
        # To upgrade: pull the new digest, re-test with a read-only root, bump.
        - name: searxng
          image: searxng/searxng:latest@sha256:c7cc75852051bf6254afda6ed1b920dd1677d8efe4ab141bf558f02e582f4371
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsNonRoot: true
            runAsUser: 977
            runAsGroup: 977
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          volumeMounts:
            - name: searxng-settings
              mountPath: /etc/searxng
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/searxng
              
          resources:
            requests:
              cpu:    20m
              memory: 160Mi
            limits:
              cpu:    250m
              memory: 384Mi

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds:       10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds:       30
